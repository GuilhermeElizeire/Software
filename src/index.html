<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'self' http://*.local http://*; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'">
    <title>Chavi</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="header">
        <h1>🛰️ Chavi</h1>
        <div class="header-actions">
            <button id="btnFechar" class="btn-danger">❌ Sair</button>
            <button id="btnRescan" class="btn-rescan">🔍 Escanear Rede</button>
        </div>
    </div>

    <div class="actions-bar">
        <div class="search-row">
            <input type="text" id="searchInput" placeholder="Filtrar por nome ou IP cadastrado...">
        </div>
        
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <label style="display: flex; align-items: center; gap: 8px; cursor: pointer;">
                <input type="checkbox" id="selectAll">
                <strong>Selecionar Todos (Online)</strong>
            </label>
            <div style="display: flex; gap: 10px;">
                <input type="file" id="massFile" style="display:none" accept=".bin">
                <button id="btnSelectFW" style="padding: 8px 15px; border-radius: 6px; cursor:pointer;">📁 Selecionar FW</button>
                <button id="btnMassUpdate" style="background:#1a73e8; color:white; border:none; padding: 8px 15px; border-radius: 6px; cursor:pointer; font-weight:bold;">🚀 Atualizar OTA</button>
            </div>
        </div>
    </div>

    <div id="lista"></div>

    <script src="renderer.js"></script>
</body>
</html>
