<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Chavi Fleet Control</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="header">
        <h1>🛰️ Chavi</h1>
        <div class="header-actions">
            <button id="btnFechar" class="btn-danger">❌ Sair</button>
            <button id="btnRescan" class="btn-rescan">🔍 Escanear Rede</button>
        </div>
    </div>

    <div class="actions-bar">
        <div class="search-row">
            <input type="text" id="searchInput" placeholder="Filtrar por nome ou IP...">
        </div>
        
        <div class="controls-row">
            <label class="checkbox-container">
                <input type="checkbox" id="selectAll">
                <strong>Selecionar Todos (Online)</strong>
            </label>
            <div class="button-group">
                <input type="file" id="massFile" style="display:none" accept=".bin">
                <button id="btnSelectFW">📁 Selecionar FW</button>
                <button id="btnMassUpdate" class="btn-primary">🚀 Atualizar OTA</button>
            </div>
        </div>
    </div>

    <div id="lista"></div>

<script defer src="renderer.js"></script>
</body>
</html>
